<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>{{DB_NAME}}</title>
    <link rel="stylesheet" href="/codemirror/lib/codemirror.css">
    <script type="text/javascript" src="/codemirror/lib/codemirror.js"></script>
    <script type="text/javascript" src="/codemirror/mode/sql/sql.js"></script>
    <script type="text/javascript" src="/codemirror/addon/edit/matchbrackets.js"></script>
    <script type="text/javascript" src="/codemirror/addon/hint/show-hint.js"></script>
    <script type="text/javascript" src="/codemirror/addon/hint/sql-hint.js"></script>
    <link rel="stylesheet"  href="/codemirror/theme/idea.css">
    <link rel="stylesheet"  href="/codemirror/addon/hint/show-hint.css">
    <link rel="stylesheet" type="text/css" href="/web_ui/w2ui-2.0.min.css">
    <script type="text/javascript" src="/web_ui/w2ui-2.0.min.js"></script>
    <link rel="stylesheet" href="/fontawesome/css/all.css">
    <style>
        .CodeMirror {font-size: 15px;width: 100%, ;height: 100%;}
        .CodeMirror-hints { z-index: 10000 !important; }
        .custom-rt {
            position: absolute;
            top: 5px;
            right: 10px;
            z-index: 1000;
            padding: 6px 12px;
            border: none;
            cursor: pointer;
          }
        .cm-error-line {
          background-color: #ffebeb; /* светло-красный фон */
          color: #b00020;            /* цвет текста */
         }
    </style>
</head>
<body>

<input type="file" id="patternFile" style="display: none;" accept=".yaml, .txt">
<button id="modelBtn" style="display: none;" onclick="openModel()" title="">model</button>
<div id="layout" style="position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;">
</div>

<script type="text/javascript" src="/js/db.js"></script>
</body>
</html>
