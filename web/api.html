<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>API</title>
        <link rel="stylesheet" href="/codemirror/codemirror.min.css">
        <script type="text/javascript" src="/codemirror/codemirror.min.js"></script>
        <script type="text/javascript" src="/codemirror/syntax_javascript.min.js"></script>
        <script type="text/javascript" src="/codemirror/addon_matchbrackets.min.js"></script>
        <link rel="stylesheet"  href="/codemirror/theme_idea.min.css">
        <link rel="stylesheet" type="text/css" href="/web_ui/w2ui-2.0.min.css">
        <link rel="stylesheet" href="/fontawesome/css/all.css">
        <style>
            body { font-family: Arial, sans-serif; margin: 40px; }
            .demo { margin: 20px 0; padding: 20px; border: 1px solid #ccc; border-radius: 14px;}
            .output { background: #f5f5f5; padding: 10px; margin: 10px 0; min-height: 50px;  border-radius: 14px;}
            .chan-input { width: 100%; padding: 8px; border: 1px solid #ddd;  border-radius: 4px; }
            .input-group { display: flex; gap: 10px; }
            .CodeMirror {font-size: 15px;width: 100%, ;height: 100%;}
        </style>
    </head>
    <body>
    <h1>API</h1>
    <div class="demo">
        <div class="input-group">
            <label for="method">Метод</label>
            <select name="Method" id="method" class="chan-input">
            </select>
            <button class="w2ui-btn action" onclick="run()">Старт</button>
            <button class="w2ui-btn action" onclick="help()">Помощь</button>
            <button class="w2ui-btn action" onclick="format()">Формат</button>
        </div>
        <hr>
        <div id="code"></div>
    </div>
    <div id="finite-output" class="output">
    </div>
    <script type="text/javascript" src="/js/api.js"></script>
</body>
</html>
