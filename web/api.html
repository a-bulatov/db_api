<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>API</title>
        <link rel="stylesheet" href="/codemirror/lib/codemirror.css" />
        <script
            type="text/javascript"
            src="/codemirror/lib/codemirror.js"
        ></script>
        <script
            type="text/javascript"
            src="/codemirror/mode/javascript/javascript.js"
        ></script>
        <script
            type="text/javascript"
            src="/codemirror/addon/edit/matchbrackets.js"
        ></script>
        <link rel="stylesheet" href="/codemirror/theme/idea.css" />
        <link
            rel="stylesheet"
            type="text/css"
            href="/web_ui/w2ui-2.0.min.css"
        />
        <link rel="stylesheet" href="/fontawesome/css/all.css" />
        <style>
            body {
                font-family: Arial, sans-serif;
                margin: 40px;
            }
            .demo {
                margin: 20px 0;
                padding: 20px;
                border: 1px solid #ccc;
                border-radius: 14px;
            }
            .output {
                background: #f5f5f5;
                padding: 10px;
                margin: 10px 0;
                min-height: 50px;
                border-radius: 14px;
            }
            .chan-input {
                width: 100%;
                padding: 8px;
                border: 1px solid #ddd;
                border-radius: 4px;
            }
            .input-group {
                display: flex;
                gap: 10px;
            }
            .CodeMirror {
                font-size: 15px;
                width: 100%;
                height: 100%;
            }
        </style>
    </head>
    <body>
        <div class="demo">
            <div>Параметры</div>
            <hr />
            <div id="code"></div>
            <hr />
            <div class="input-group">
                <label for="method">Метод</label>
                <select name="Method" id="method" class="chan-input"></select>
                <button
                    class="w2ui-btn action"
                    onclick="run()"
                    title="Выполнить"
                >
                    <i class="fas fa-play"></i>
                </button>
                <button
                    class="w2ui-btn action"
                    onclick="help()"
                    title="Получить описание метода"
                >
                    <i class="fas fa-question"></i>
                </button>
                <button
                    class="w2ui-btn action"
                    onclick="format()"
                    title="Форматировать json"
                >
                    <i class="fas fa-bars-staggered"></i>
                </button>
            </div>
        </div>
        <div id="timing"></div>
        <div id="finite-output" class="output"></div>
        <script type="text/javascript" src="/js/api.js"></script>
    </body>
</html>
