<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>API</title>
        <link rel="stylesheet" href="/static/codemirror.min.css">
        <script type="text/javascript" src="/static/codemirror.min.js"></script>
        <script type="text/javascript" src="/static/syntax_javascript.min.js"></script>
        <script type="text/javascript" src="/static/addon_matchbrackets.min.js"></script>
        <link rel="stylesheet"  href="/static/theme_idea.min.css">
        <style>
            body { font-family: Arial, sans-serif; margin: 40px; }
            .demo { margin: 20px 0; padding: 20px; border: 1px solid #ccc; }
            .output { background: #f5f5f5; padding: 10px; margin: 10px 0; min-height: 50px; }
            button { padding: 8px 15px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; width: 120px; }
            .chan-input { width: 100%; padding: 8px; border: 1px solid #ddd;  border-radius: 4px; }
            .input-group { display: flex; gap: 10px; }
            .CodeMirror {font-size: 15px;width: 100%, ;height: 100%;}

        </style>
    </head>
    <body>
    <h1>API</h1>
    <div class="demo">
        <div class="input-group">
            <label for="method">Метод</label>
            <select name="Method" id="method" class="chan-input">
            </select>
            <button onclick="run()">Выполнить</button>
            <button onclick="help()">Описание</button>
            <button onclick="format()">Формат</button>
        </div>
        <div id="code"></div>
    </div>
    <div id="finite-output" class="output">
    </div>
    <script type="text/javascript">
        var editor = null;
        window.onload = function() {
            editor = CodeMirror(document.getElementById("code"), {
              lineNumbers: true,
              tabSize: 4,
              value: '{}',
              mode: 'javascript',
              theme: 'idea',
              matchBrackets:true
            });
        };

        fetch('/api', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({"method": "help"})
        }).then(response => response.json())
        .then(result => {
              let sel = document.getElementById("method");
              for (let x of result.result) {
                    const option = document.createElement('option');
                    option.textContent = option.value = x;
                    sel.append(option);
              }
        })
        .catch(error => console.error('Error:', error));

        function run(){
            let sel = document.getElementById("method");
            let method = sel.value;
            let params = editor.getValue();
            fetch('/api', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
              },
              body: JSON.stringify({"method": method, "params":  JSON.parse(params)})
            }).then(response => response.json())
            .then(result => {
                  let out = document.getElementById("finite-output");
                  out.innerHTML = `<pre>${JSON.stringify(result, null, 4)}</pre>`;
            })
            .catch(error => console.error('Error:', error));
        };

        function help(){
            let sel = document.getElementById("method");
            let method = sel.value;
            fetch('/api', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
              },
              body: JSON.stringify({"method": "help", "params":{"method":method}})
            }).then(response => response.json())
            .then(result => {
                  let out = document.getElementById("finite-output");
                  out.innerHTML = `<pre>${result.result}</pre>`;
            })
            .catch(error => console.error('Error:', error));
        };

        function format(){
           let params = editor.getValue();
           editor.setValue(JSON.stringify(JSON.parse(editor.getValue()),null , 4));
        };

    </script>
</body>
</html>
